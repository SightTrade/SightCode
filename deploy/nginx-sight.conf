# =============================================================================
# SIGHT — Nginx reverse proxy (HTTPS terminates here, app stays on 127.0.0.1:3210)
#
# Install as: /etc/nginx/sites-available/sight.conf
# Enable:     ln -s /etc/nginx/sites-available/sight.conf /etc/nginx/sites-enabled/
# TLS:        run `certbot --nginx -d YOUR_DOMAIN` after this file is enabled —
#             certbot fills in the ssl_certificate paths and the :80 redirect.
#
# SIGHT's long-lived connections are handled explicitly:
#   - /api/discover/stream and /api/price/stream are Server-Sent Events:
#     buffering MUST be off and read timeouts MUST be long (hours), otherwise
#     Nginx closes the live feeds.
#   - The upgrade map below supports WebSocket clients (forward-compatible;
#     SIGHT's PumpPortal connection is server-side outbound, not inbound).
# =============================================================================

# Map the client's Upgrade header for WebSocket support.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream sight_app {
    server 127.0.0.1:3210;
    keepalive 32;
}

# ---------------------------------------------------------------- HTTP :80 ---
# Serves the ACME HTTP-01 challenge, then redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------- HTTPS :443 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot manages these two lines:
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS at the edge (the app sets its own X-Frame-Options, nosniff,
    # Referrer-Policy, Permissions-Policy and COOP headers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Uploads are tiny (JSON-RPC proxy caps bodies at 64 KiB); keep a small limit.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    # Do not gzip event streams (they must flush immediately).
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Long-lived SSE endpoints (discovery + live prices) ----
    # Buffering off + long timeouts keep the streams open for hours.
    location /api/discover/stream {
        proxy_pass         http://sight_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        add_header         X-Accel-Buffering no;
    }

    location /api/price/stream {
        proxy_pass         http://sight_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        add_header         X-Accel-Buffering no;
    }

    # ---- Forward-compatible WebSocket endpoint ----
    location ~* ^/(api/)?(ws|socket)/ {
        proxy_pass         http://sight_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    # ---- Everything else (pages + regular API routes) ----
    location / {
        proxy_pass         http://sight_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
